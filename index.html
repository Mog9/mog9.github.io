<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mohit</title>

  <!-- Monospace font -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1e1e26;
      --panel: #1b1b22;
      --text: #ffb86c;
      --muted: #c9a26b;
      --border: #ffb86c;
    }
    [data-theme="light"] {
    --bg: #f4f4f4;
    --panel: #ffffff;
    --text: #1e1e26;
    --muted: #555555;
    --border: #1e1e26;
    }
    .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
    }

    .theme-toggle:hover {
    background: var(--text);
    color: var(--panel);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: "JetBrains Mono", monospace;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Outer frame */
    .frame {
      width: 90%;
      max-width: 1100px;
      min-height: 85vh;
      border: 2px solid var(--border);
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--panel);
    }

    /* Top navigation */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-left {
      font-weight: 600;
      cursor: pointer;
    }

    .nav-center {
      display: flex;
      gap: 28px;
      font-size: 14px;
    }

    .nav-center a {
      color: var(--text);
      text-decoration: none;
    }

    .nav-center a:hover {
      text-decoration: underline;
    }

    .nav-right {
      font-size: 14px;
      opacity: 0.7;
    }

    /* Main content */
    .content {
      text-align: center;
      margin-top: -40px;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    .name {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 14px;
      color: var(--muted);
    }

    /* Footer links */
    .footer {
      display: flex;
      justify-content: center;
      gap: 48px;
      font-size: 14px;
    }

    .footer a {
      color: var(--text);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
    .social {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: var(--text);
        text-decoration: none;
        font-size: 14px;
        }

    .social svg {
        width: 18px;
        height: 18px;
        fill: var(--text);
        }

    .social:hover {
        text-decoration: underline;
        }

    .home-avatar {
    display: flex;
    align-items: center;
    }

    .home-avatar img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--border);
    object-fit: cover;
    cursor: pointer;
    }

    .home-avatar img:hover {
    opacity: 0.85;
    }



    /* Responsive */
    @media (max-width: 768px) {
      .name {
        font-size: 36px;
      }

      .nav-center {
        gap: 16px;
        font-size: 13px;
      }
      
    }
  </style>
</head>

<script>
  function toggleTheme() {
    const body = document.body;
    const btn = document.querySelector(".theme-toggle");

    if (body.getAttribute("data-theme") === "light") {
      body.removeAttribute("data-theme");
      btn.textContent = "dark";
    } else {
      body.setAttribute("data-theme", "light");
      btn.textContent = "light";
    }
  }
</script>


<body>
  <div class="frame">

    <!-- Top bar -->
    <div class="nav">
        <a href="index.html" class="home-avatar">
        <img src="/pic.jpg" alt="home">
        </a>


        <div class="nav-center">
        <a href="blogs/blog.html">blogs</a>
        <a href="projects/project.html">projects</a>
        <a href="papers/paper.html">research</a>
        <a href="about/aboutme.html">about</a>
        </div>

        <button class="theme-toggle" onclick="toggleTheme()">
            dark
        </button>
    </div>

    <!-- Center content -->
    <div class="content">
      <div class="name">MOHIT</div>
      <div class="tagline">exploring vision models</div>
    </div>

    <!-- Footer -->
    <div class="footer">
    <a href="https://x.com/mohitwt_" target="_blank" class="social">
        <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.244 2H21.552L14.36 10.242L22.828 22H16.184L10.98 14.844L4.684 22H1.372L9.056 13.214L0.828 2H7.64L12.356 8.488L18.244 2ZM17.088 20H18.92L6.644 4H4.676L17.088 20Z"/>
        </svg>
        X/Twitter
    </a>

    <a href="https://github.com/Mog9" target="_blank" class="social">
        <!-- GitHub icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 .5C5.648.5.5 5.648.5 12c0 5.086 3.292 9.386 7.862 10.907.575.105.786-.25.786-.556 0-.274-.01-1.002-.015-1.966-3.198.695-3.873-1.54-3.873-1.54-.523-1.33-1.277-1.684-1.277-1.684-1.044-.714.08-.699.08-.699 1.155.081 1.763 1.186 1.763 1.186 1.027 1.76 2.695 1.252 3.35.957.104-.744.402-1.252.732-1.54-2.552-.29-5.236-1.276-5.236-5.681 0-1.255.448-2.282 1.184-3.087-.118-.29-.513-1.46.112-3.045 0 0 .965-.309 3.163 1.18a10.99 10.99 0 012.88-.387c.977.004 1.962.132 2.88.387 2.197-1.489 3.161-1.18 3.161-1.18.626 1.585.231 2.755.114 3.045.737.805 1.183 1.832 1.183 3.087 0 4.416-2.688 5.388-5.252 5.673.414.356.783 1.062.783 2.141 0 1.547-.014 2.795-.014 3.175 0 .309.209.667.792.554C20.71 21.382 24 17.083 24 12c0-6.352-5.148-11.5-12-11.5z"/>
        </svg>
        GitHub
    </a>
    </div>


  </div>
</body>
</html>
