<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blog Post</title>
  <link rel="icon" href="/pic.jpg" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f0e8;
      --panel: #f5f0e8;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #d1ccc4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: "JetBrains Mono", monospace;
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .frame {
      width: 94%;
      max-width: 1200px;
      min-height: 90vh;
      border: 1px solid var(--border);
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .home-avatar img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }

    .article {
      margin: 40px auto;
      width: 100%;
      max-width: 720px;
    }

    .article-title {
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .article-meta {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .article p {
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .article h2 {
      font-size: 22px;
      margin: 48px 0 16px;
    }

    .article h3 {
      font-size: 18px;
      margin: 32px 0 12px;
    }

    .article code {
      background: rgba(0, 0, 0, 0.06);
      padding: 2px 6px;
      font-size: 14px;
    }

    .article pre {
      background: rgba(0, 0, 0, 0.04);
      padding: 16px;
      overflow-x: auto;
      margin: 24px 0;
    }

    .article pre code {
      background: none;
      padding: 0;
    }

    .reveal {
      opacity: 0;
      transform: translateY(10px);
      animation: revealUp 0.6s ease-out forwards;
    }

    @keyframes revealUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-out { opacity: 0; transition: opacity 0.25s ease-out; }

    figure {
      margin: 32px 0;
      text-align: center;
    }

    .figure img {
      max-width: 100%;
      border: 1px solid var(--border);
    }

    .figure.small img { max-width: 360px; }
    .figure.medium img { max-width: 520px; }
    .figure.large img { max-width: 720px; }

    .figure figcaption {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .back-container {
      margin-top: 64px;
      text-align: center;
    }

    .back-link {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 8px 14px;
      display: inline-block;
    }

    .back-link:hover {
      background: var(--text);
      color: var(--panel);
    }
  </style>
</head>

<body>

<div class="frame">

  <div class="nav">
    <a href="/index.html" class="home-avatar reveal" style="animation-delay: 0.1s;">
      <img src="/pic.jpg" alt="home">
    </a>
    <div></div>
  </div>

  <article class="article">

    <h1 class="article-title reveal" style="animation-delay: 0.2s;">
      Blog Post Title
    </h1>

    <div class="article-meta reveal" style="animation-delay: 0.25s;">
      Date
    </div>

    <div class="reveal" style="animation-delay: 0.3s;">
      <p>
        Write your content here.
      </p>
    </div>

    <div class="back-container reveal" style="animation-delay: 0.4s;">
    <a href="../blog.html" class="back-link">
        ← back to blogs
    </a>
    </div>

  </article>

</div>

<script>
  document.querySelectorAll("a").forEach(link => {
    const href = link.getAttribute("href");
    if (!href || href.startsWith("#")) return;

    link.addEventListener("click", e => {
      e.preventDefault();
      document.body.classList.add("fade-out");
      setTimeout(() => { window.location.href = href; }, 200);
    });
  });
</script>

</body>
</html>
