<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Research Papers</title>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1e1e26;
      --panel: #1b1b22;
      --text: #ffb86c;
      --muted: #c9a26b;
      --border: #ffb86c;
    }

    [data-theme="light"] {
      --bg: #f4f4f4;
      --panel: #ffffff;
      --text: #1e1e26;
      --muted: #555555;
      --border: #1e1e26;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: "JetBrains Mono", monospace;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .frame {
      width: 94%;
      max-width: 1200px;
      min-height: 90vh;
      border: 2px solid var(--border);
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    /* NAV */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .home-avatar img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .theme-toggle:hover {
      background: var(--text);
      color: var(--panel);
    }

    /* TITLE */
    .title {
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 40px 0 24px;
    }

    /* PAPER LIST */
    .paper-list {
      flex: 1;
      border: none;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: calc(90vh - 220px);
      overflow-y: auto;
      padding-right: 6px;
    }
    .paper-list::-webkit-scrollbar {
      width: 6px;
    }

    .paper-list::-webkit-scrollbar-thumb {
      background: rgba(255, 184, 108, 0.4);
    }

    .paper-list::-webkit-scrollbar-track {
      background: transparent;
    }


    .paper-card {
      border: 1px solid var(--border);
      padding: 18px 20px;
    }

    .paper-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .paper-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .paper-link {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    }

    .paper-link:hover {
    text-decoration: underline;
    color: var(--text);
    }

    .paper-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    }

    .paper-left {
    display: flex;
  } 

    .paper-repo {
    display: flex;
    padding: 6px;
    align-items: center;
    gap: 6px;
    font-size: 16px;
    color: var(--muted);
    text-decoration: none;
    }

    .paper-repo svg {
    width: 16px;
    height: 16px;
    fill: var(--muted);
    }

    .paper-repo:hover {
    color: var(--text);
    }

    .paper-repo:hover svg {
    fill: var(--text);
    }

    .paper-read {
    margin-left: auto;
    font-size: 15px;
    color: var(--muted);
    text-decoration: none;
    }

    .paper-read:hover {
    text-decoration: underline;
    color: var(--text);
    }

    .paper-blog {
    font-size: 15px;
    color: var(--muted);
    text-decoration: none;
    margin: 0 auto;
  }

  .paper-blog:hover {
    text-decoration: underline;
    color: var(--text);
  }


    /* ANIMATIONS */
    .reveal {
      opacity: 0;
      transform: translateY(10px);
      animation: revealUp 0.6s ease-out forwards;
    }

    @keyframes revealUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.25s ease-out;
    }

    .toggle-animate {
      animation: togglePulse 0.2s ease-out;
    }

    @keyframes togglePulse {
      50% {
        transform: scale(0.96);
        opacity: 0.8;
      }
    }
  </style>
</head>

<script>
  function toggleTheme() {
    const body = document.body;
    const btn = document.querySelector(".theme-toggle");

    btn.classList.remove("toggle-animate");
    void btn.offsetWidth;
    btn.classList.add("toggle-animate");

    if (body.getAttribute("data-theme") === "light") {
      body.removeAttribute("data-theme");
      btn.textContent = "dark";
    } else {
      body.setAttribute("data-theme", "light");
      btn.textContent = "light";
    }
  }

  document.querySelectorAll("a").forEach(link => {
    const href = link.getAttribute("href");
    if (!href || href.startsWith("#")) return;

    link.addEventListener("click", e => {
      e.preventDefault();
      document.body.classList.add("fade-out");

      setTimeout(() => {
        window.location.href = href;
      }, 200);
    });
    window.addEventListener("pageshow", function (event) {
    document.body.classList.remove("fade-out");
  });
  });
</script>
