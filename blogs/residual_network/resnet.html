<!DOCTYPE html>

  <style>
    :root {
      --bg: #1e1e26;
      --panel: #1b1b22;
      --text: #ffb86c;
      --muted: #c9a26b;
      --border: #ffb86c;
    }

    [data-theme="light"] {
      --bg: #f4f4f4;
      --panel: #ffffff;
      --text: #1e1e26;
      --muted: #555555;
      --border: #1e1e26;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: "JetBrains Mono", monospace;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* FRAME */
    .frame {
      width: 94%;
      max-width: 1200px;
      min-height: 90vh;
      border: 2px solid var(--border);
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    /* NAV */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .home-avatar img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .theme-toggle:hover {
      background: var(--text);
      color: var(--panel);
    }

    /* ARTICLE LAYOUT */
    .article {
      margin: 40px auto;
      width: 100%;
      max-width: 720px; /* reading width */
    }

    .article-title {
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .article-meta {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 40px;
    }

    /* TYPOGRAPHY */
    .article p {
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .article h2 {
      font-size: 22px;
      margin: 48px 0 16px;
    }

    .article h3 {
      font-size: 18px;
      margin: 32px 0 12px;
    }

    .article code {
      background: rgba(255, 184, 108, 0.12);
      padding: 2px 6px;
      font-size: 14px;
    }

    .article pre {
      background: rgba(255, 184, 108, 0.08);
      padding: 16px;
      overflow-x: auto;
      margin: 24px 0;
    }

    .article pre code {
      background: none;
      padding: 0;
    }

    /* ANIMATIONS */
    .reveal {
      opacity: 0;
      transform: translateY(10px);
      animation: revealUp 0.6s ease-out forwards;
    }

    @keyframes revealUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.25s ease-out;
    }

    .toggle-animate {
      animation: togglePulse 0.2s ease-out;
    }

    @keyframes togglePulse {
      50% {
        transform: scale(0.96);
        opacity: 0.8;
      }
    }

    figure {
    margin: 32px 0;
    text-align: center;
    }

    .figure img {
    max-width: 100%;
    border: 1px solid var(--border);
    }

    /* Size variants */
    .figure.small img {
    max-width: 360px;
    }

    .figure.medium img {
    max-width: 520px;
    }

    .figure.large img {
    max-width: 720px;
    }

    /* Caption */
    .figure figcaption {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    }

    /* BACK LINK */
    .back-container {
    margin-top: 64px;
    text-align: center;
    }

    .back-link {
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 8px 14px;
    display: inline-block;
    }

    .back-link:hover {
    background: var(--text);
    color: var(--panel);
    }

  </style>
</head>

<script>
  function toggleTheme() {
    const body = document.body;
    const btn = document.querySelector(".theme-toggle");

    btn.classList.remove("toggle-animate");
    void btn.offsetWidth;
    btn.classList.add("toggle-animate");

    if (body.getAttribute("data-theme") === "light") {
      body.removeAttribute("data-theme");
      btn.textContent = "dark";
    } else {
      body.setAttribute("data-theme", "light");
      btn.textContent = "light";
    }
  }

  document.querySelectorAll("a").forEach(link => {
    const href = link.getAttribute("href");
    if (!href || href.startsWith("#")) return;

    link.addEventListener("click", e => {
      e.preventDefault();
      document.body.classList.add("fade-out");

      setTimeout(() => {
        window.location.href = href;
      }, 200);
    });
  });
</script>
