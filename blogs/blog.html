<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blogs</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f0e8;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #d1ccc4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: "JetBrains Mono", monospace;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 80px;
      border-bottom: 1px solid var(--border);
    }

    .home-avatar img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
    }
    .home-avatar img:hover { opacity: 0.85; }

    .nav-center {
      display: flex;
      gap: 28px;
      font-size: 14px;
    }

    .nav-center a {
      color: var(--text);
      text-decoration: none;
    }
    .nav-center a:hover { text-decoration: underline; }

    .content {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 80px;
      flex: 1;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 32px;
    }

    .blog-row {
      display: flex;
      align-items: baseline;
      gap: 40px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .blog-date {
      font-size: 14px;
      color: var(--muted);
      min-width: 130px;
      flex-shrink: 0;
    }

    .blog-title {
      font-size: 15px;
      color: var(--text);
      text-decoration: none;
    }

    .blog-title:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .nav { padding: 20px 24px; }
      .content { padding: 32px 24px; }
      .blog-row { flex-direction: column; gap: 4px; }
      .blog-date { min-width: auto; }
    }
  </style>
</head>
<body>

  <div class="nav">
    <a href="/index.html" class="home-avatar">
      <img src="/pic.jpg" alt="home">
    </a>
    <div class="nav-center">
      <a href="/index.html">Home</a>
      <a href="/blogs/blog.html">Blogs</a>
      <a href="/projects/project.html">Projects</a>
    </div>
  </div>

  <div class="content">
    <div class="section-title">Blog Posts</div>

    <div class="blog-row">
      <span class="blog-date">Jan 7, 2026</span>
      <a href="backprop_diffusion/backprop.html" class="blog-title">Diffusion Models and Backpropagation Explained</a>
    </div>

    <div class="blog-row">
      <span class="blog-date">Dec 23, 2025</span>
      <a href="residual_network/resnet.html" class="blog-title">Deep Residual Learning for Image Recognition</a>
    </div>

    <div class="blog-row">
      <span class="blog-date">Dec 19, 2025</span>
      <a href="distil_knowledge/distilling.html" class="blog-title">Distilling Knowledge in a Neural Network</a>
    </div>

  </div>

</body>
</html>
