<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blogs</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1e1e26;
      --text: #ffb86c;
      --muted: #c9a26b;
      --border: #ffb86c;
    }
    [data-theme="light"] {
      --bg: #f4f4f4;
      --text: #1e1e26;
      --muted: #555555;
      --border: #1e1e26;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: "JetBrains Mono", monospace;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 40px;
    }

    .home-avatar img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border);
      object-fit: cover;
      cursor: pointer;
    }
    .home-avatar img:hover { opacity: 0.85; }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .theme-toggle:hover { background: var(--text); color: var(--bg); }

    .title {
      text-align: center;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 20px 0 32px;
    }

    .blog-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 0 40px;
      overflow-y: auto;
    }

    .blog-list::-webkit-scrollbar { width: 6px; }
    .blog-list::-webkit-scrollbar-thumb { background: rgba(255,184,108,0.4); }
    .blog-list::-webkit-scrollbar-track { background: transparent; }

    .blog-card {
      display: block;
      border: 1px solid var(--border);
      padding: 18px 20px;
      text-decoration: none;
      color: var(--text);
    }
    .blog-card:hover { background: rgba(255,184,108,0.05); }

    .blog-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .blog-meta { font-size: 12px; color: var(--muted); }

    .footer {
      display: flex;
      justify-content: center;
      padding: 24px 40px;
    }

    .back-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 6px 18px;
      cursor: pointer;
      text-decoration: none;
    }
    .back-btn:hover { background: var(--text); color: var(--bg); }

    .reveal {
      opacity: 0;
      transform: translateY(10px);
      animation: revealUp 0.6s ease-out forwards;
    }
    @keyframes revealUp { to { opacity: 1; transform: translateY(0); } }

    .toggle-animate { animation: togglePulse 0.2s ease-out; }
    @keyframes togglePulse { 50% { transform: scale(0.96); opacity: 0.8; } }

    .fade-out { opacity: 0; transition: opacity 0.25s ease-out; }

    @media (max-width: 768px) {
      .nav { padding: 20px 24px; }
      .title { font-size: 36px; }
      .blog-list { padding: 0 24px; }
    }
  </style>
</head>
<body>

  <div class="nav">
    <a href="/index.html" class="home-avatar reveal" style="animation-delay: 0.1s;">
      <img src="/pic.jpg" alt="home">
    </a>
    <div></div>
    <div class="reveal" style="animation-delay: 0.15s;">
      <button class="theme-toggle" onclick="toggleTheme()">dark</button>
    </div>
  </div>

  <div class="title reveal" style="animation-delay: 0.2s;">BLOGS</div>

  <div class="blog-list reveal" style="animation-delay: 0.3s;">
    <a href="distil_knowledge/distilling.html" class="blog-card">
      <div class="blog-title">Distilling Knowledge in a Neural Network</div>
      <div class="blog-meta">Dec 19, 2025</div>
    </a>
    <a href="residual_network/resnet.html" class="blog-card">
      <div class="blog-title">Deep Residual Learning for Image Recognition</div>
      <div class="blog-meta">Dec 23, 2025</div>
    </a>
    <a href="backprop_diffusion/backprop.html" class="blog-card">
      <div class="blog-title">Diffusion Models and Backpropagation Explained</div>
      <div class="blog-meta">7 Jan 2026</div>
    </a>
  </div>

  <div class="footer reveal" style="animation-delay: 0.4s;">
    <a href="/index.html" class="back-btn">back</a>
  </div>

<script>
  function toggleTheme() {
    const body = document.body;
    const btn = document.querySelector(".theme-toggle");
    btn.classList.remove("toggle-animate");
    void btn.offsetWidth;
    btn.classList.add("toggle-animate");
    if (body.getAttribute("data-theme") === "light") {
      body.removeAttribute("data-theme");
      btn.textContent = "dark";
    } else {
      body.setAttribute("data-theme", "light");
      btn.textContent = "light";
    }
  }

  document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", e => {
      const href = link.getAttribute("href");
      if (!href || href.startsWith("#")) return;
      e.preventDefault();
      document.body.classList.add("fade-out");
      setTimeout(() => { window.location.href = href; }, 200);
    });
  });

  window.addEventListener("pageshow", () => {
    document.body.classList.remove("fade-out");
  });
</script>

</body>
</html>
