<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>videos</title>
  <link rel="icon" href="/pic.jpg" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f0e8;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #d1ccc4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      font-family: "JetBrains Mono", monospace;
      color: var(--text);
    }

    .page {
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      overflow: hidden;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 80px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .home-avatar img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }
    .home-avatar img:hover { opacity: 0.85; }

    .nav-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 28px;
      font-size: 16px;
    }

    .nav-center a { color: var(--text); text-decoration: none; }
    .nav-center a:hover { text-decoration: underline; }

    .title {
      text-align: center;
      font-size: 54px;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0 0 16px;
    }

    .playlists-scroll {
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 80px 8px;
      min-height: 0;
    }

    .playlists-scroll::-webkit-scrollbar { width: 6px; }
    .playlists-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); }
    .playlists-scroll::-webkit-scrollbar-track { background: transparent; }

    .playlists-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .playlist-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s;
      display: flex;
      overflow: hidden;
    }

    .playlist-card:hover { border-color: var(--text); }

    .playlist-thumb {
      width: 180px;
      min-height: 120px;
      flex-shrink: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .playlist-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .playlist-info {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .playlist-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .playlist-meta {
      font-size: 14px;
      color: var(--muted);
    }

    .bottom-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      padding: 12px 80px 28px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
    }

    .back-link {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 8px 20px;
      justify-self: center;
    }
    .back-link:hover { background: var(--text); color: var(--bg); }

    .reveal {
      opacity: 0;
      transform: translateY(10px);
      animation: revealUp 0.6s ease-out forwards;
    }
    @keyframes revealUp { to { opacity: 1; transform: translateY(0); } }
    .fade-out { opacity: 0; transition: opacity 0.25s ease-out; }

    @media (max-width: 768px) {
      .playlists-grid { grid-template-columns: 1fr; }
      .nav, .playlists-scroll, .bottom-bar { padding-left: 32px; padding-right: 32px; }
    }
    @media (max-width: 480px) { .playlists-grid { grid-template-columns: 1fr; } }
  </style>
</head>

<body>

<script>
  document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", e => {
      const href = link.getAttribute("href");
      if (!href || href.startsWith("#") || link.target === "_blank") return;
      e.preventDefault();
      document.body.classList.add("fade-out");
      setTimeout(() => window.location.href = href, 200);
    });
  });

  window.addEventListener("pageshow", () => {
    document.body.classList.remove("fade-out");
  });
</script>

<div class="page">

  <div class="nav">
    <a href="/index.html" class="home-avatar reveal" style="animation-delay: 0.1s;">
      <img src="/pic.jpg" alt="home">
    </a>
    <div class="nav-center">
      <a href="/blogs/blog.html" class="reveal" style="animation-delay: 0.15s;">blogs</a>
      <a href="/projects/project.html" class="reveal" style="animation-delay: 0.2s;">projects</a>
      <a href="/videos/videos.html" class="reveal" style="animation-delay: 0.25s;">videos</a>
    </div>
  </div>

  <div class="title reveal" style="animation-delay: 0.3s;">videos</div>

  <div class="playlists-scroll reveal" style="animation-delay: 0.4s;">
    <div class="playlists-grid">

      <a href="cudagraphs.html" class="playlist-card">
        <div class="playlist-thumb">
          <img src="cuda-graphs/cudagraph.png" alt="CUDA GRAPHS">
        </div>
        <div class="playlist-info">
          <div class="playlist-title">CUDA GRAPHS</div>
          <div class="playlist-meta">1 video</div>
        </div>
      </a>

    </div>
  </div>

  <div class="bottom-bar reveal" style="animation-delay: 0.5s;">
    <div></div>
    <a href="/index.html" class="back-link">← back</a>
    <div></div>
  </div>
  </div>

</body>
</html>
