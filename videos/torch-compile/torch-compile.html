<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TORCH.COMPILE</title>
  <link rel="icon" href="/pic.jpg" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f0e8;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #d1ccc4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: "JetBrains Mono", monospace;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .nav {
      display: flex;
      align-items: center;
      padding: 20px 80px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .home-avatar img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }
    .home-avatar img:hover { opacity: 0.85; }

    .nav-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 28px;
      font-size: 16px;
    }

    .nav-center a { color: var(--text); text-decoration: none; }
    .nav-center a:hover { text-decoration: underline; }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 80px 20px;
      overflow-y: auto;
    }

    .playlist-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 32px;
      text-align: center;
    }

    .parts-list {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .part-card {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s;
    }

    .part-card:hover:not(.coming-soon) { border-color: var(--text); }

    .part-card.coming-soon {
      cursor: default;
    }

    .part-card.coming-soon .part-thumb,
    .part-card.coming-soon .part-info {
      opacity: 0.5;
    }

    .part-thumb {
      width: 200px;
      min-height: 112px;
      flex-shrink: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .part-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .part-thumb .placeholder {
      color: var(--muted);
      font-size: 12px;
    }

    .part-info {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .part-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .part-meta {
      font-size: 13px;
      color: var(--muted);
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      padding: 12px 80px 28px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
    }

    .back-link {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 8px 20px;
    }
    .back-link:hover { background: var(--text); color: var(--bg); }

    .reveal {
      opacity: 0;
      transform: translateY(20px);
      animation: revealUp 0.8s ease-out forwards;
    }
    @keyframes revealUp { to { opacity: 1; transform: translateY(0); } }
    .fade-out { opacity: 0; transition: opacity 0.25s ease-out; }

    @media (max-width: 768px) {
      .nav, .content, .bottom-bar { padding-left: 32px; padding-right: 32px; }
      .part-thumb { width: 140px; }
    }
  </style>
</head>

<body>

<script>
  document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", e => {
      const href = link.getAttribute("href");
      if (!href || href.startsWith("#") || link.target === "_blank") return;
      e.preventDefault();
      document.body.classList.add("fade-out");
      setTimeout(() => window.location.href = href, 200);
    });
  });

  window.addEventListener("pageshow", () => {
    document.body.classList.remove("fade-out");
  });
</script>

  <div class="nav">
    <a href="/index.html" class="home-avatar reveal" style="animation-delay: 0.1s;">
      <img src="/pic.jpg" alt="home">
    </a>
    <div class="nav-center">
      <a href="/blogs/blog.html" class="reveal" style="animation-delay: 0.2s;">blogs</a>
      <a href="/projects/project.html" class="reveal" style="animation-delay: 0.3s;">projects</a>
      <a href="/videos/videos.html" class="reveal" style="animation-delay: 0.4s;">videos</a>
    </div>
  </div>

  <div class="content">

    <div class="playlist-title reveal" style="animation-delay: 0.5s;">TORCH.COMPILE</div>

    <div class="parts-list">

      <a href="torch-compile-part1.html" class="part-card reveal" style="animation-delay: 0.6s;">
        <div class="part-thumb">
          <img src="thumb1.png" alt="Part 1">
        </div>
        <div class="part-info">
          <div class="part-title">Part 1: Why LLM Inference Frameworks Use torch.compile</div>
        </div>
      </a>

      <div class="part-card coming-soon reveal" style="animation-delay: 0.7s;">
        <div class="part-thumb">
          <span class="placeholder">coming soon</span>
        </div>
        <div class="part-info">
          <div class="part-title">Part 2</div>
          <div class="part-meta">coming soon</div>
        </div>
      </div>

      <div class="part-card coming-soon reveal" style="animation-delay: 0.8s;">
        <div class="part-thumb">
          <span class="placeholder">coming soon</span>
        </div>
        <div class="part-info">
          <div class="part-title">Part 3</div>
          <div class="part-meta">coming soon</div>
        </div>
      </div>

      <div class="part-card coming-soon reveal" style="animation-delay: 0.9s;">
        <div class="part-thumb">
          <span class="placeholder">coming soon</span>
        </div>
        <div class="part-info">
          <div class="part-title">Part 4</div>
          <div class="part-meta">coming soon</div>
        </div>
      </div>

      <div class="part-card coming-soon reveal" style="animation-delay: 1.0s;">
        <div class="part-thumb">
          <span class="placeholder">coming soon</span>
        </div>
        <div class="part-info">
          <div class="part-title">Part 5</div>
          <div class="part-meta">coming soon</div>
        </div>
      </div>

    </div>

  </div>

  <div class="bottom-bar reveal" style="animation-delay: 1.1s;">
    <a href="/videos/videos.html" class="back-link">← back</a>
  </div>

</body>
</html>
